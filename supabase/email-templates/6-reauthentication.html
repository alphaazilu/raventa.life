<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background-color:#ffffff;">
  <div style="background-color:#ffffff;padding:32px 16px;font-family:'Noto Sans Thai','Helvetica Neue',Arial,sans-serif;">
    <div style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #d7dfd6;">
      <div style="padding:28px 32px 20px;text-align:center;border-bottom:1px solid #d7dfd6;">
        <img src="https://www.raventawellness.com/images/logo-full.png" width="132" alt="RAVENTA" style="display:inline-block;width:132px;height:auto;border:0;">
      </div>
      <div style="padding:32px;">
        <h1 style="margin:0 0 16px;font-size:20px;color:#2b2620;">ยืนยันตัวตนของคุณ</h1>
        <p style="margin:0 0 12px;font-size:15px;line-height:1.7;color:#2b2620;">กรอกรหัสด้านล่างในหน้าเว็บ RAVENTA เพื่อยืนยันการทำรายการ</p>
        <p style="margin:0 0 12px;font-size:13px;line-height:1.6;color:#6b6255;">Enter this code on the RAVENTA site to confirm it’s you.</p>
        <p style="margin:20px 0;padding:16px;background-color:#eef4ec;border:1px solid #d7dfd6;border-radius:10px;text-align:center;">
          <span style="display:block;font-size:30px;font-weight:700;letter-spacing:0.3em;color:#8b1e2d;">{{ .Token }}</span>
        </p>
        <p style="margin:16px 0 0;font-size:13px;line-height:1.6;color:#6b6255;">หากคุณไม่ได้ทำรายการนี้ กรุณาเปลี่ยนรหัสผ่านและติดต่อเรา<br>If this wasn’t you, change your password and contact us.</p>
      </div>
      <div style="padding:18px 32px;border-top:1px solid #d7dfd6;text-align:center;">
        <p style="margin:0;font-size:12px;color:#6b6255;">RAVENTA Wellness Retreat</p>
      </div>
    </div>
  </div>
</body></html>
